[project]
name = "elever-api"
version = "1.0.0"
description = "FastAPI + MongoDB backend for the elever restaurant site"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from this list).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pymongo>=4.13,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
]

[tool.vercel]
entrypoint = "server:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient nudges towards an httpx fork; httpx itself still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "ASYNC"]
